services:
  mongo:
    # 7.0 until a MongoDB 8.x image runs on current Ubuntu kernels (see issue #2).
    image: mongo:7.0.43
    ports:
      - '27018:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 2s
      timeout: 5s
      retries: 15
