services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: keyset
      POSTGRES_PASSWORD: keyset
      POSTGRES_DB: keyset
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keyset']
      interval: 2s
      timeout: 3s
      retries: 15
