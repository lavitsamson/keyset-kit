# PostgreSQL for the benchmarks (`pnpm bench`). Same image as the integration tests.
# shared_buffers is raised so the whole 1M-row table stays in memory: the benchmark measures
# query plans and CPU work, not disk speed.
services:
  postgres:
    image: postgres:18.6-alpine
    command: ['postgres', '-c', 'shared_buffers=512MB']
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bench']
      interval: 2s
      timeout: 3s
      retries: 15
