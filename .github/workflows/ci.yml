name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); the comment shows the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate test Prisma client
        run: pnpm generate

      - name: Lint
        run: pnpm lint && pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + type tests
        run: pnpm test

      # GitHub-hosted Ubuntu runners include Docker, which Testcontainers uses for real databases.
      # Coverage thresholds apply to the combined unit + integration run.
      - name: Integration tests (Testcontainers) + coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Package checks (publint + attw)
        run: pnpm check:package

      - name: Size limit
        run: pnpm size

      # Builds, seeds and runs each app in examples/ against real databases, paging over HTTP.
      - name: Examples smoke test
        run: pnpm test:examples

      - name: Docs build (TypeDoc + VitePress)
        if: matrix.node == 24
        run: pnpm docs:build
