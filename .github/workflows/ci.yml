name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); the comment shows the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm generate

      # The examples import keyset-kit through its package exports (dist/), so build before
      # linting, the same way users consume the package.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint && pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + type tests
        run: pnpm test

      # GitHub-hosted Ubuntu runners include Docker, which Testcontainers uses for real databases.
      # Coverage thresholds apply to the combined unit + integration run.
      - name: Docker version (debug)
        run: docker version

      - name: Mongo container by hand (debug)
        run: |
          uname -r
          for v in 8.3.11 8.3.13 8.0.34; do
            echo "=== mongo:$v"
            docker run -d --name "m$v" "mongo:$v" --replSet rs0 --bind_ip_all >/dev/null
            sleep 15
            docker exec "m$v" mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' && echo "RESULT $v OK" || { echo "RESULT $v FAIL"; docker logs "m$v" 2>&1 | grep '"s":"F"' | tail -3; }
            docker rm -f "m$v" >/dev/null
          done

      - name: Integration tests (Testcontainers) + coverage
        run: pnpm test:int test/integration/mongoose.test.ts
        env:
          DEBUG: testcontainers*

      - name: Package checks (publint + attw)
        run: pnpm check:package

      - name: Size limit
        run: pnpm size

      # Builds, seeds and runs each app in examples/ against real databases, paging over HTTP.
      - name: Examples smoke test
        run: pnpm test:examples

      - name: Docs build (TypeDoc + VitePress)
        if: matrix.node == 24
        run: pnpm docs:build
